<style>
  :root{
    /* Warm ground — low arousal, skin-adjacent, non-clinical */
    --linen:        #EEEBE5;
    --linen-2:      #E4E0D8;
    /* Pale blue-green plate — trust hue, desaturated so it never reads corporate */
    --mist:         #DCE4E3;
    --mist-2:       #CBD8D7;
    /* Grounding tone — deep enough to read competent, soft enough to stay calm */
    --slate:        #2C3A40;
    --slate-soft:   #4A5B62;
    --harbor:       #4E6B75;
    /* Warm accent — carries the warmth half of trust */
    --sand:         #B39670;
    --hair:         rgba(44,58,64,.13);

    --display: "Archivo", ui-sans-serif, system-ui, sans-serif;
    --body:    "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    --script:  "Newsreader", Georgia, serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    font-family:var(--body);
    background:var(--linen);
    color:var(--slate);
    line-height:1.5;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }

  @media (min-width:600px){
    body{
      padding:40px 20px;
      background:radial-gradient(120% 90% at 50% 0%, #4A5B62 0%, #333F45 75%);
    }
  }

  /* ============ CARD SHELL ============ */
  .card{
    width:100%;
    max-width:430px;
    background:var(--linen);
    overflow:hidden;
    position:relative;
  }
  @media (min-width:600px){
    .card{
      border-radius:16px;
      box-shadow:0 40px 90px -24px rgba(20,28,32,.5), 0 0 0 1px rgba(255,255,255,.05);
    }
  }

  /* ============ DAYLIGHT PLATE (top) ============ */
  .ridge{
    position:relative;
    background:var(--mist);
    padding:22px 28px 78px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    overflow:hidden;
  }
  /* the photograph */
  .ridge::before{
    content:"";
    position:absolute;
    inset:0;
    background:url("skyline.jpg") center 30% / cover no-repeat;
    opacity:0;
    transform:scale(1.06);
    animation:photoIn 1.9s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  /* linen wash: light at the skyline, near-solid where the type sits */
  .ridge::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(238,235,229,.30) 0%,
      rgba(238,235,229,.15) 24%,
      rgba(238,235,229,.32) 38%,
      rgba(238,235,229,.89) 51%,
      rgba(238,235,229,.98) 63%,
      rgba(238,235,229,1) 100%);
  }
  .ridge > *{ position:relative; z-index:2; }
  @keyframes photoIn{ to{ opacity:1; transform:none; } }

  .ridge__top{
    position:relative;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:16px;
  }

  .share-btn{
    font-family:var(--body);
    font-size:11px;
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate-soft);
    background:rgba(255,255,255,.5);
    border:1px solid var(--hair);
    border-radius:100px;
    padding:7px 15px;
    cursor:pointer;
    transition:background .2s, color .2s;
    white-space:nowrap;
  }
  .share-btn:hover{ background:#fff; color:var(--slate); }

  .ridge__name{
    position:relative;
    margin-top:8px;
  }
  .name{
    font-family:var(--display);
    font-variation-settings:"wdth" 108, "wght" 400;
    font-size:clamp(1.7rem, 8vw, 2.2rem);
    line-height:1.06;
    letter-spacing:.055em;
    text-transform:uppercase;
    color:var(--slate);
  }
  .name span{ display:block; }
  .name span.last{ font-variation-settings:"wdth" 108, "wght" 600; }

  .tagline{
    font-family:var(--script);
    font-style:italic;
    font-weight:300;
    font-size:1.05rem;
    color:var(--slate-soft);
    margin-top:13px;
    max-width:30ch;
  }

  /* ============ PHOTO ON THE SEAM ============ */
  .seam{ position:relative; height:0; }
  .photo{
    position:absolute;
    left:28px;
    top:-66px;
    width:132px;
    height:132px;
    border-radius:50%;
    overflow:hidden;
    background:var(--mist-2);
    box-shadow:0 0 0 4px var(--linen), 0 0 0 5px rgba(179,150,112,.5), 0 16px 30px -14px rgba(44,58,64,.45);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; }
  .photo__initials{
    display:none;
    font-family:var(--display);
    font-variation-settings:"wdth" 112, "wght" 400;
    font-size:30px;
    letter-spacing:.08em;
    color:var(--harbor);
  }

  /* ============ BODY ============ */
  .body{ padding:80px 28px 0; }

  .role{
    font-family:var(--display);
    font-variation-settings:"wdth" 112, "wght" 500;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--harbor);
    padding-bottom:18px;
    border-bottom:1px solid var(--hair);
  }

  /* ============ ACTIONS ============ */
  .actions{ padding:22px 0 26px; display:grid; gap:10px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn{
    font-family:var(--body);
    font-size:14px;
    font-weight:500;
    letter-spacing:.01em;
    padding:15px 18px;
    border-radius:11px;
    border:1px solid rgba(44,58,64,.28);
    background:rgba(255,255,255,.45);
    color:var(--slate);
    text-decoration:none;
    text-align:center;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:background .18s, border-color .18s, transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn svg{ width:15px; height:15px; flex:none; }
  .btn:active{ transform:scale(.985); }
  .btn:hover{ background:#fff; border-color:var(--slate); }

  .btn--primary{
    background:var(--slate);
    border-color:var(--slate);
    color:var(--linen);
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:12.5px;
    padding:17px 18px;
  }
  .btn--primary:hover{ background:var(--harbor); border-color:var(--harbor); color:#fff; }

  /* ============ SOCIAL ============ */
  .social{
    display:flex;
    gap:26px;
    padding:22px 0;
    border-bottom:1px solid var(--hair);
    flex-wrap:wrap;
  }
  .social a{
    font-family:var(--display);
    font-variation-settings:"wdth" 108, "wght" 500;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--slate-soft);
    text-decoration:none;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    transition:color .18s, border-color .18s;
  }
  .social a:hover{ color:var(--sand); border-bottom-color:var(--sand); }

  /* ============ LEGAL FOOTER ============ */
  .legal{ padding:22px 0 30px; }
  .legal__meta{
    font-size:11px;
    line-height:1.6;
    color:var(--slate-soft);
  }
  .legal__bottom{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--hair);
  }
  .legal__bottom svg{ width:16px; height:16px; flex:none; opacity:.7; }
  .legal__bottom span{
    font-size:9.5px;
    line-height:1.5;
    letter-spacing:.02em;
    color:var(--slate-soft);
    opacity:.9;
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translate(-50%, 16px);
    background:var(--slate);
    color:var(--linen);
    font-size:13px;
    letter-spacing:.02em;
    padding:12px 22px;
    border-radius:100px;
    box-shadow:0 12px 30px -8px rgba(20,28,32,.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.is-visible{ opacity:1; transform:translate(-50%, 0); }

  /* ============ ENTRANCE ============ */
  .reveal{ opacity:0; transform:translateY(10px); animation:rise .7s cubic-bezier(.22,1,.36,1) forwards; }
  .d1{ animation-delay:.30s } .d2{ animation-delay:.40s } .d3{ animation-delay:.50s }
  .d4{ animation-delay:.60s } .d5{ animation-delay:.70s } .d6{ animation-delay:.80s }
  .d7{ animation-delay:.90s } .d8{ animation-delay:1.0s }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  :focus-visible{ outline:2px solid var(--harbor); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; animation:none; }
    .ridge::before{ opacity:1; transform:none; animation:none; }
    .btn, .valuation, .valuation__arrow, .social a, .toast{ transition:none; }
  }
</style>
</head>

(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const fullName = `${CARD.firstName} ${CARD.lastName}`;

  /* ---------- Populate the card ---------- */
  document.title = `${fullName} — ${CARD.role} Real Estate, Los Angeles`;
  $("nFirst").textContent = CARD.firstName;
  $("nLast").textContent  = CARD.lastName;
  $("tagline").textContent = CARD.tagline;
  $("initials").textContent = (CARD.firstName[0] || "") + (CARD.lastName[0] || "");
  $("headshot").alt = fullName;

  $("role").textContent = `${CARD.role} · DRE #${CARD.agentDre}`;
  $("callLink").href  = `tel:${CARD.phone}`;
  $("textLink").href  = `sms:${CARD.phone}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?"}body=${encodeURIComponent(CARD.smsBody)}`;
  $("emailLink").href = `mailto:${CARD.email}`;
  $("igLink").href    = CARD.instagram;
  $("bioLink").href   = CARD.bio;

  $("dreLine").textContent = `${fullName}, REALTOR® · DRE #${CARD.agentDre}`;

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("is-visible"), 2600);
  }

  /* ---------- Save to contacts (.vcf built from CARD) ---------- */
  function buildVCard() {
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${CARD.lastName};${CARD.firstName};;;`,
      `FN:${fullName}`,
      `TITLE:${CARD.role} Real Estate · DRE #${CARD.agentDre}`,
      `TEL;TYPE=CELL,VOICE:${CARD.phone}`,
      `EMAIL;TYPE=INTERNET,WORK:${CARD.email}`,
      `URL:${CARD.bio}`,
      `X-SOCIALPROFILE;TYPE=instagram:${CARD.instagram}`,
      `NOTE:${CARD.tagline}. California DRE #${CARD.agentDre}.`,
      `REV:${new Date().toISOString()}`
    ];
    if (CARD.embedPhoto && CARD.photoBase64) {
      lines.splice(lines.length - 1, 0, `PHOTO;ENCODING=b;TYPE=JPEG:${CARD.photoBase64}`);
    }
    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

  $("saveBtn").addEventListener("click", () => {
    const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url;
    a.download = `${CARD.firstName}-${CARD.lastName}`.replace(/[^A-Za-z0-9-]/g, "") + ".vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Contact card downloaded");
  });

  /* ---------- Share / copy link ---------- */
  $("shareBtn").addEventListener("click", async () => {
    const shareUrl = location.origin + location.pathname;
    if (navigator.share) {
      try {
        await navigator.share({ title: fullName, text: `${fullName} — ${CARD.role} Real Estate`, url: shareUrl });
        return;
      } catch (e) { if (e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(shareUrl);
      toast("Link copied");
    } catch (e) {
      toast(shareUrl);
    }
  });
})();
</script>
</body>
</html>
